[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc4cf"
version = "0.1.0"
description = "Generate an offline interactive corpus reference with Context-Fabric"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["text-fabric", "context-fabric", "corpus", "documentation", "digital-humanities"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.13"
authors = [
  { name = "Tony Jurg" },
  { name = "OpenAI Codex" },
]
dependencies = ["context-fabric==0.5.8"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pre-commit>=4.0",
  "ruff>=0.9",
]
docs = [
  "sphinx>=8.2,<10",
  "sphinx-rtd-theme>=3,<4",
  "sphinxcontrib-mermaid>=2.1,<3",
]

[project.scripts]
doc4cf = "doc4cf.generator:main"

[tool.setuptools]
packages = ["doc4cf"]

[tool.setuptools.package-data]
doc4cf = ["assets/*.js", "assets/*.css", "assets/*.svg", "schemas/*.json", "py.typed"]

[project.urls]
Repository = "https://github.com/tonyjurg/Doc4CF"
Issues = "https://github.com/tonyjurg/Doc4CF/issues"

[tool.ruff]
target-version = "py313"
# Notebooks are runnable walkthroughs (asserts, top-level imports), not library code.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
# S310/S311/S603/S607 are false positives here: fixed https endpoints,
# argument lists without a shell, and non-cryptographic retry jitter.
ignore = ["E501", "S310", "S311", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = ["doc4cf"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
