name: Bug report
description: Report a reproducible problem in Doc4CF.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before reporting a security issue, use the private process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, smallest relevant corpus input, and error output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Doc4CF version
      placeholder: e.g. 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.13.1
    validations:
      required: true
