name: Deploy documentation to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'install-guide.html'
      - 'software-design.html'
      - 'query-guide.html'
      - 'project-assets/**'
      - 'examples/**'
      - 'docs/api/**'
      - 'doc4cf/**'
      - 'pyproject.toml'
      - 'scripts/build_api_docs.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'install-guide.html'
      - 'software-design.html'
      - 'query-guide.html'
      - 'project-assets/**'
      - 'examples/**'
      - 'docs/api/**'
      - 'doc4cf/**'
      - 'pyproject.toml'
      - 'scripts/build_api_docs.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and documentation dependencies
        run: python -m pip install -e '.[docs]'
      - name: Stage the project site and corpus documentation
        run: |
          mkdir -p _site
          cp index.html install-guide.html software-design.html query-guide.html _site/
          cp -r examples project-assets _site/
          for corpus in N1904 DSS OldBabylonian; do
            test -s "_site/examples/$corpus/index.html"
            grep -Fq "href=\"examples/$corpus/index.html\"" _site/index.html
          done
      - name: Build the versioned Sphinx API reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_api_docs.py --output _site/api
      - name: Verify the combined site
        run: |
          test -s _site/index.html
          test -s _site/api/index.html
          grep -Fq 'href="api/index.html"' _site/index.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.private == false && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
